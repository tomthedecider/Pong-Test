<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --cyan: #05f7f2;
    --magenta: #ff2ec4;
    --purple: #a238ff;
    --yellow: #f9f002;
    --bg-deep: #0a0118;
    --bg-deeper: #05010d;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(162, 56, 255, 0.35), transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(5, 247, 242, 0.15), transparent 70%),
      repeating-linear-gradient(0deg, rgba(255, 46, 196, 0.06) 0px, rgba(255, 46, 196, 0.06) 1px, transparent 1px, transparent 28px),
      linear-gradient(180deg, var(--bg-deeper) 0%, var(--bg-deep) 50%, #12002b 100%);
    color: #d9f7ff;
    font-family: "Orbitron", system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.25) 0px,
      rgba(0, 0, 0, 0.25) 1px,
      transparent 2px,
      transparent 4px
    );
    mix-blend-mode: overlay;
    z-index: 5;
  }
  h1 {
    margin: 0;
    letter-spacing: 0.15em;
    font-family: "Press Start 2P", "Orbitron", monospace;
    font-weight: 400;
    font-size: clamp(0.9rem, 3.6vw, 1.7rem);
    max-width: 90vw;
    text-align: center;
    background: linear-gradient(180deg, var(--cyan) 0%, var(--magenta) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow:
      0 0 8px rgba(5, 247, 242, 0.6),
      0 0 24px rgba(255, 46, 196, 0.5);
    padding-bottom: 4px;
  }
  #wrap {
    position: relative;
  }
  canvas {
    background: radial-gradient(ellipse 120% 100% at 50% 100%, #180430 0%, var(--bg-deeper) 70%);
    border: 2px solid var(--cyan);
    border-radius: 8px;
    display: block;
    touch-action: none;
    box-shadow:
      0 0 12px rgba(5, 247, 242, 0.7),
      0 0 32px rgba(162, 56, 255, 0.45),
      inset 0 0 24px rgba(255, 46, 196, 0.15);
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(8, 2, 20, 0.85);
    border-radius: 8px;
    text-align: center;
    padding: 16px;
  }
  #overlay.hidden { display: none; }
  #overlay p {
    margin: 0;
    max-width: 340px;
    line-height: 1.7;
    color: #b9e7ff;
    text-shadow: 0 0 6px rgba(5, 247, 242, 0.4);
  }
  button {
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    color: #05010d;
    border: none;
    border-radius: 4px;
    padding: 12px 28px;
    font-family: "Press Start 2P", "Orbitron", monospace;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    font-weight: 400;
    cursor: pointer;
    box-shadow: 0 0 14px rgba(255, 46, 196, 0.7), 0 0 28px rgba(5, 247, 242, 0.4);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button:hover {
    transform: translateY(-1px) scale(1.03);
    box-shadow: 0 0 20px rgba(255, 46, 196, 0.9), 0 0 40px rgba(5, 247, 242, 0.6);
  }
  #hint {
    opacity: 0.85;
    font-size: 0.8rem;
    text-align: center;
    max-width: 480px;
    color: var(--cyan);
    text-shadow: 0 0 6px rgba(5, 247, 242, 0.5);
    letter-spacing: 0.03em;
  }
  #muteBtn {
    position: fixed;
    top: 16px;
    right: 16px;
    background: rgba(8, 2, 20, 0.7);
    color: var(--cyan);
    border: 1px solid var(--cyan);
    border-radius: 50%;
    width: 44px;
    height: 44px;
    padding: 0;
    font-size: 1.2rem;
    line-height: 1;
    box-shadow: 0 0 10px rgba(5, 247, 242, 0.5);
    z-index: 10;
  }
  #muteBtn:hover {
    box-shadow: 0 0 16px rgba(5, 247, 242, 0.8);
  }
</style>
</head>
<body>
  <button id="muteBtn" type="button" aria-label="Mute music" title="Mute music">🔊</button>
  <h1>THIS SHIT TOOK ME 5 MINS</h1>
  <div id="wrap">
    <canvas id="game" width="800" height="500"></canvas>
    <div id="overlay">
      <p id="overlayText">First to 7 points wins. Left paddle: W/S. Right paddle: Arrow Up/Down.<br>On touch devices, drag on the left/right half of the screen.</p>
      <button id="startBtn">Start Game</button>
    </div>
  </div>
  <p id="hint">Press Space to pause/resume during play.</p>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const muteBtn = document.getElementById('muteBtn');

  const W = canvas.width;
  const H = canvas.height;
  const WIN_SCORE = 7;

  const NEON_CYAN = '#05f7f2';
  const NEON_MAGENTA = '#ff2ec4';
  const NEON_YELLOW = '#f9f002';
  const GRID_COLOR = 'rgba(162, 56, 255, 0.25)';

  const PADDLE_W = 12;
  const PADDLE_H = 90;
  // Speeds are ~44% of the original arcade pace (30% slower, then another
  // 20% slower on top of that). Music tempo is intentionally unaffected.
  const PADDLE_SPEED = 3.64;
  const BALL_SIZE = 12;
  const BASE_BALL_SPEED = 2.8;
  const MAX_BALL_SPEED = 7.84;

  let state = 'idle'; // idle | playing | paused | over
  let gridOffset = 0;

  const left = { x: 20, y: H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H, score: 0, dy: 0 };
  const right = { x: W - 20 - PADDLE_W, y: H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H, score: 0, dy: 0 };
  const ball = { x: W / 2, y: H / 2, r: BALL_SIZE / 2, vx: 0, vy: 0 };

  function resetBall(direction) {
    ball.x = W / 2;
    ball.y = H / 2;
    const angle = (Math.random() * 0.5 - 0.25) * Math.PI; // -45..45 deg
    const speed = BASE_BALL_SPEED;
    ball.vx = Math.cos(angle) * speed * direction;
    ball.vy = Math.sin(angle) * speed;
  }

  function resetMatch() {
    left.score = 0;
    right.score = 0;
    left.y = H / 2 - PADDLE_H / 2;
    right.y = H / 2 - PADDLE_H / 2;
    resetBall(Math.random() < 0.5 ? 1 : -1);
  }

  const keys = {};
  window.addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
    keys[e.key] = true;
    if (e.key === ' ') togglePause();
  });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });

  function togglePause() {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  }

  // Touch controls: drag on left half moves left paddle, right half moves right paddle.
  const activeTouches = {};
  canvas.addEventListener('touchstart', handleTouch, { passive: false });
  canvas.addEventListener('touchmove', handleTouch, { passive: false });
  canvas.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) delete activeTouches[t.identifier];
  });

  function handleTouch(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const scaleY = H / rect.height;
    for (const t of e.touches) {
      const relX = t.clientX - rect.left;
      const relY = (t.clientY - rect.top) * scaleY;
      activeTouches[t.identifier] = { x: relX, y: relY };
    }
    let leftY = null, rightY = null;
    for (const id in activeTouches) {
      const p = activeTouches[id];
      if (p.x < rect.width / 2) leftY = p.y;
      else rightY = p.y;
    }
    if (leftY !== null) left.y = clamp(leftY - PADDLE_H / 2, 0, H - PADDLE_H);
    if (rightY !== null) right.y = clamp(rightY - PADDLE_H / 2, 0, H - PADDLE_H);
  }

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function update() {
    if (state !== 'playing') return;

    if (keys['w'] || keys['W']) left.y -= PADDLE_SPEED;
    if (keys['s'] || keys['S']) left.y += PADDLE_SPEED;
    if (keys['ArrowUp']) right.y -= PADDLE_SPEED;
    if (keys['ArrowDown']) right.y += PADDLE_SPEED;
    left.y = clamp(left.y, 0, H - PADDLE_H);
    right.y = clamp(right.y, 0, H - PADDLE_H);

    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; }
    if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.vy *= -1; }

    if (ball.vx < 0 &&
        ball.x - ball.r < left.x + left.w &&
        ball.x - ball.r > left.x &&
        ball.y > left.y && ball.y < left.y + left.h) {
      ball.x = left.x + left.w + ball.r;
      bounceOffPaddle(left);
    }

    if (ball.vx > 0 &&
        ball.x + ball.r > right.x &&
        ball.x + ball.r < right.x + right.w &&
        ball.y > right.y && ball.y < right.y + right.h) {
      ball.x = right.x - ball.r;
      bounceOffPaddle(right);
    }

    if (ball.x < -30) {
      right.score++;
      checkWin() || resetBall(1);
    } else if (ball.x > W + 30) {
      left.score++;
      checkWin() || resetBall(-1);
    }
  }

  function bounceOffPaddle(paddle) {
    const relativeIntersect = (ball.y - (paddle.y + paddle.h / 2)) / (paddle.h / 2);
    const bounceAngle = relativeIntersect * (Math.PI / 3); // max 60 deg
    const speed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.05, MAX_BALL_SPEED);
    const direction = paddle === left ? 1 : -1;
    ball.vx = Math.cos(bounceAngle) * speed * direction;
    ball.vy = Math.sin(bounceAngle) * speed;
  }

  function checkWin() {
    if (left.score >= WIN_SCORE || right.score >= WIN_SCORE) {
      state = 'over';
      const winner = left.score >= WIN_SCORE ? 'Left' : 'Right';
      overlayText.innerHTML = `${winner} player wins!<br>${left.score} - ${right.score}`;
      startBtn.textContent = 'Play Again';
      overlay.classList.remove('hidden');
      return true;
    }
    return false;
  }

  function drawGrid() {
    // Faint synthwave floor grid with a slow horizontal drift.
    ctx.save();
    ctx.strokeStyle = GRID_COLOR;
    ctx.lineWidth = 1;

    const spacingX = 40;
    const offset = gridOffset % spacingX;
    for (let x = -spacingX; x <= W + spacingX; x += spacingX) {
      ctx.beginPath();
      ctx.moveTo(x + offset, 0);
      ctx.lineTo(x + offset, H);
      ctx.stroke();
    }

    const spacingY = 40;
    for (let y = 0; y <= H; y += spacingY) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawNeonRect(x, y, w, h, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.fillRect(x, y, w, h);
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawGrid();

    ctx.save();
    ctx.strokeStyle = 'rgba(255, 46, 196, 0.8)';
    ctx.shadowColor = NEON_MAGENTA;
    ctx.shadowBlur = 10;
    ctx.setLineDash([8, 10]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.restore();

    drawNeonRect(left.x, left.y, left.w, left.h, NEON_CYAN);
    drawNeonRect(right.x, right.y, right.w, right.h, NEON_MAGENTA);

    ctx.save();
    ctx.fillStyle = NEON_YELLOW;
    ctx.shadowColor = NEON_YELLOW;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.font = '48px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = NEON_CYAN;
    ctx.shadowColor = NEON_CYAN;
    ctx.shadowBlur = 14;
    ctx.globalAlpha = 0.85;
    ctx.fillText(left.score, W / 2 - 100, 60);
    ctx.fillStyle = NEON_MAGENTA;
    ctx.shadowColor = NEON_MAGENTA;
    ctx.fillText(right.score, W / 2 + 100, 60);
    ctx.restore();

    if (state === 'paused') {
      ctx.save();
      ctx.fillStyle = '#f9f002';
      ctx.shadowColor = NEON_YELLOW;
      ctx.shadowBlur = 16;
      ctx.font = '28px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', W / 2, H / 2);
      ctx.restore();
    }
  }

  function loop() {
    update();
    draw();
    gridOffset += 0.3;
    requestAnimationFrame(loop);
  }

  // --- Background synth music ------------------------------------------
  // A small procedural synthwave loop (Am - F - C - G) generated with the
  // Web Audio API, so no external audio files are needed for deployment.
  const TARGET_VOLUME = 0.22;
  const TEMPO = 96;
  const SEC_PER_BEAT = 60 / TEMPO;
  const STEP_DUR = SEC_PER_BEAT / 2; // eighth notes
  const STEPS_PER_CHORD = 16; // 2 bars per chord
  const ARP_PATTERN = [0, 1, 2, 3, 2, 1, 0, 3];
  const PROGRESSION = [
    { bass: 110.00, arp: [220.00, 261.63, 329.63, 440.00] }, // Am
    { bass: 87.31, arp: [174.61, 220.00, 261.63, 349.23] },  // F
    { bass: 130.81, arp: [261.63, 329.63, 392.00, 523.25] }, // C
    { bass: 98.00, arp: [196.00, 246.94, 293.66, 392.00] },  // G
  ];

  let audioCtx = null;
  let masterGain = null;
  let delayNode = null;
  let musicStarted = false;
  let musicMuted = false;
  let nextNoteTime = 0;
  let stepCounter = 0;
  let chordIndex = 0;
  let schedulerTimer = null;

  function ensureAudio() {
    if (audioCtx) return;
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtor) return;
    audioCtx = new AudioCtor();

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0;
    masterGain.connect(audioCtx.destination);

    delayNode = audioCtx.createDelay();
    delayNode.delayTime.value = STEP_DUR * 3;
    const feedback = audioCtx.createGain();
    feedback.gain.value = 0.32;
    const delayFilter = audioCtx.createBiquadFilter();
    delayFilter.type = 'lowpass';
    delayFilter.frequency.value = 2200;
    delayNode.connect(delayFilter);
    delayFilter.connect(feedback);
    feedback.connect(delayNode);
    delayFilter.connect(masterGain);
  }

  function playArpNote(freq, time) {
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = freq;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 2000;
    filter.Q.value = 0.7;

    const gain = audioCtx.createGain();
    const peak = 0.22;
    const dur = STEP_DUR * 0.85;
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(peak, time + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    gain.connect(delayNode);

    osc.start(time);
    osc.stop(time + dur + 0.05);
  }

  function playBassNote(freq, time, duration) {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;

    const gain = audioCtx.createGain();
    const peak = 0.3;
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(peak, time + 0.5);
    gain.gain.setValueAtTime(peak, time + duration - 0.4);
    gain.gain.linearRampToValueAtTime(0, time + duration);

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start(time);
    osc.stop(time + duration + 0.05);
  }

  function scheduleStep(time) {
    const chord = PROGRESSION[chordIndex];
    const arpFreq = chord.arp[ARP_PATTERN[stepCounter % ARP_PATTERN.length]];
    playArpNote(arpFreq, time);
    if (stepCounter === 0) {
      playBassNote(chord.bass, time, STEPS_PER_CHORD * STEP_DUR);
    }
  }

  function advanceStep() {
    nextNoteTime += STEP_DUR;
    stepCounter++;
    if (stepCounter >= STEPS_PER_CHORD) {
      stepCounter = 0;
      chordIndex = (chordIndex + 1) % PROGRESSION.length;
    }
  }

  function scheduler() {
    while (nextNoteTime < audioCtx.currentTime + 0.15) {
      scheduleStep(nextNoteTime);
      advanceStep();
    }
  }

  function startMusic() {
    ensureAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (musicStarted) return;
    musicStarted = true;
    nextNoteTime = audioCtx.currentTime + 0.1;
    const target = musicMuted ? 0 : TARGET_VOLUME;
    masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(target, audioCtx.currentTime + 2);
    schedulerTimer = setInterval(scheduler, 25);
  }

  function setMuted(muted) {
    musicMuted = muted;
    muteBtn.textContent = musicMuted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', musicMuted ? 'Unmute music' : 'Mute music');
    muteBtn.title = musicMuted ? 'Unmute music' : 'Mute music';
    if (audioCtx && masterGain && musicStarted) {
      const target = musicMuted ? 0 : TARGET_VOLUME;
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.linearRampToValueAtTime(target, audioCtx.currentTime + 0.15);
    }
  }

  muteBtn.addEventListener('click', () => {
    ensureAudio();
    setMuted(!musicMuted);
  });
  // ------------------------------------------------------------------

  startBtn.addEventListener('click', () => {
    resetMatch();
    state = 'playing';
    overlay.classList.add('hidden');
    startMusic();
  });

  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
