<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #0b0f14;
    color: #e6edf3;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  h1 {
    margin: 0;
    letter-spacing: 0.3em;
    font-weight: 600;
    font-size: 1.5rem;
  }
  #wrap {
    position: relative;
  }
  canvas {
    background: #05080b;
    border: 2px solid #2b3542;
    border-radius: 6px;
    display: block;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(5, 8, 11, 0.75);
    border-radius: 6px;
    text-align: center;
    padding: 16px;
  }
  #overlay.hidden { display: none; }
  #overlay p { margin: 0; opacity: 0.8; max-width: 320px; }
  button {
    background: #58a6ff;
    color: #05080b;
    border: none;
    border-radius: 4px;
    padding: 10px 22px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #79b8ff; }
  #hint {
    opacity: 0.6;
    font-size: 0.85rem;
    text-align: center;
    max-width: 480px;
  }
</style>
</head>
<body>
  <h1>PONG</h1>
  <div id="wrap">
    <canvas id="game" width="800" height="500"></canvas>
    <div id="overlay">
      <p id="overlayText">First to 7 points wins. Left paddle: W/S. Right paddle: Arrow Up/Down.<br>On touch devices, drag on the left/right half of the screen.</p>
      <button id="startBtn">Start Game</button>
    </div>
  </div>
  <p id="hint">Press Space to pause/resume during play.</p>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');

  const W = canvas.width;
  const H = canvas.height;
  const WIN_SCORE = 7;

  const PADDLE_W = 12;
  const PADDLE_H = 90;
  const PADDLE_SPEED = 6.5;
  const BALL_SIZE = 12;
  const BASE_BALL_SPEED = 5;

  let state = 'idle'; // idle | playing | paused | over

  const left = { x: 20, y: H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H, score: 0, dy: 0 };
  const right = { x: W - 20 - PADDLE_W, y: H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H, score: 0, dy: 0 };
  const ball = { x: W / 2, y: H / 2, r: BALL_SIZE / 2, vx: 0, vy: 0 };

  function resetBall(direction) {
    ball.x = W / 2;
    ball.y = H / 2;
    const angle = (Math.random() * 0.5 - 0.25) * Math.PI; // -45..45 deg
    const speed = BASE_BALL_SPEED;
    ball.vx = Math.cos(angle) * speed * direction;
    ball.vy = Math.sin(angle) * speed;
  }

  function resetMatch() {
    left.score = 0;
    right.score = 0;
    left.y = H / 2 - PADDLE_H / 2;
    right.y = H / 2 - PADDLE_H / 2;
    resetBall(Math.random() < 0.5 ? 1 : -1);
  }

  const keys = {};
  window.addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
    keys[e.key] = true;
    if (e.key === ' ') togglePause();
  });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });

  function togglePause() {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  }

  // Touch controls: drag on left half moves left paddle, right half moves right paddle.
  const activeTouches = {};
  canvas.addEventListener('touchstart', handleTouch, { passive: false });
  canvas.addEventListener('touchmove', handleTouch, { passive: false });
  canvas.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) delete activeTouches[t.identifier];
  });

  function handleTouch(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const scaleY = H / rect.height;
    for (const t of e.touches) {
      const relX = t.clientX - rect.left;
      const relY = (t.clientY - rect.top) * scaleY;
      activeTouches[t.identifier] = { x: relX, y: relY };
    }
    let leftY = null, rightY = null;
    for (const id in activeTouches) {
      const p = activeTouches[id];
      if (p.x < rect.width / 2) leftY = p.y;
      else rightY = p.y;
    }
    if (leftY !== null) left.y = clamp(leftY - PADDLE_H / 2, 0, H - PADDLE_H);
    if (rightY !== null) right.y = clamp(rightY - PADDLE_H / 2, 0, H - PADDLE_H);
  }

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function update() {
    if (state !== 'playing') return;

    if (keys['w'] || keys['W']) left.y -= PADDLE_SPEED;
    if (keys['s'] || keys['S']) left.y += PADDLE_SPEED;
    if (keys['ArrowUp']) right.y -= PADDLE_SPEED;
    if (keys['ArrowDown']) right.y += PADDLE_SPEED;
    left.y = clamp(left.y, 0, H - PADDLE_H);
    right.y = clamp(right.y, 0, H - PADDLE_H);

    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; }
    if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.vy *= -1; }

    if (ball.vx < 0 &&
        ball.x - ball.r < left.x + left.w &&
        ball.x - ball.r > left.x &&
        ball.y > left.y && ball.y < left.y + left.h) {
      ball.x = left.x + left.w + ball.r;
      bounceOffPaddle(left);
    }

    if (ball.vx > 0 &&
        ball.x + ball.r > right.x &&
        ball.x + ball.r < right.x + right.w &&
        ball.y > right.y && ball.y < right.y + right.h) {
      ball.x = right.x - ball.r;
      bounceOffPaddle(right);
    }

    if (ball.x < -30) {
      right.score++;
      checkWin() || resetBall(1);
    } else if (ball.x > W + 30) {
      left.score++;
      checkWin() || resetBall(-1);
    }
  }

  function bounceOffPaddle(paddle) {
    const relativeIntersect = (ball.y - (paddle.y + paddle.h / 2)) / (paddle.h / 2);
    const bounceAngle = relativeIntersect * (Math.PI / 3); // max 60 deg
    const speed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.05, 14);
    const direction = paddle === left ? 1 : -1;
    ball.vx = Math.cos(bounceAngle) * speed * direction;
    ball.vy = Math.sin(bounceAngle) * speed;
  }

  function checkWin() {
    if (left.score >= WIN_SCORE || right.score >= WIN_SCORE) {
      state = 'over';
      const winner = left.score >= WIN_SCORE ? 'Left' : 'Right';
      overlayText.innerHTML = `${winner} player wins!<br>${left.score} - ${right.score}`;
      startBtn.textContent = 'Play Again';
      overlay.classList.remove('hidden');
      return true;
    }
    return false;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.strokeStyle = '#2b3542';
    ctx.setLineDash([8, 10]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#e6edf3';
    ctx.fillRect(left.x, left.y, left.w, left.h);
    ctx.fillRect(right.x, right.y, right.w, right.h);

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = 'bold 48px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8b949e';
    ctx.fillText(left.score, W / 2 - 60, 60);
    ctx.fillText(right.score, W / 2 + 60, 60);

    if (state === 'paused') {
      ctx.fillStyle = 'rgba(230,237,243,0.9)';
      ctx.font = 'bold 28px system-ui, sans-serif';
      ctx.fillText('PAUSED', W / 2, H / 2);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', () => {
    resetMatch();
    state = 'playing';
    overlay.classList.add('hidden');
  });

  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
